services:
  circlemud:
    build:
      context: .
    container_name: circlemud
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./lib:/opt/circlemud/lib

  # --- OpenTelemetry observability stack -----------------------------------
  # Optional — only needed for tracing the Boukensha agent (see
  # docs/plans/15_otel_tracing.md). Start everything with
  # `docker compose up -d`, or just this stack with
  # `docker compose up -d otel-collector jaeger tempo grafana`.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC — point the agent's OTEL_EXPORTER_OTLP_ENDPOINT here
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger
      - tempo

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI

  tempo:
    image: grafana/tempo:2.5.0
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200" # Tempo query API, read by Grafana

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "3001:3000" # Grafana UI (Tempo datasource pre-provisioned) — host 3001, since 3000 is a very commonly-squatted dev port
    depends_on:
      - tempo
